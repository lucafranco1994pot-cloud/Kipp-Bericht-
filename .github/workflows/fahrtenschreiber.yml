name: Fahrtenschreiber (taeglich)
on:
  schedule:
    - cron: '47 22 * * 1-5'
  workflow_dispatch:
  push:
    paths: ['.github/workflows/fahrtenschreiber.yml']
permissions:
  contents: write
concurrency: fahrtenschreiber
jobs:
  schnappschuss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt scipy
      - run: python fahrtenschreiber.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fahrtenschreiber && git commit -m "Fahrtenschreiber $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase && git push
